# BS2X SDK 模块映射配置
# 参考 WS63 的树状结构，按当前 BS2X 源码中的公共头文件归属调整。
# 配置位置：fbb_bs2x/bs2x_modules_clean_v3.yaml
# 适配版本：BS2X_1.0.20，HiSpark/bs2x 提交 7c22ea72ed49ad45f1a47aaeeb0f7614d195a6b5。
# 基于 V2 保留清理边界；仅调整映射，不删除源码。
# --sdk-root 应指向 SDK 1.0.20 的 src 目录；下列路径均相对 src，使用正斜杠。
# 已验证目录：D:/Project/codebase/bs2x/bs2x_7c22ea7_review/src。
# 本版用于未应用本地源码清理的上游：显式排除上游仍保留的八个已清理头文件。
# 依据：src/include/**/CMakeLists.txt 的 PUBLIC_HEADER、kernel/osal/include、
#       公共头文件说明以及 USB / NFC / SLE 测距 Sample 的实际引用。
# 范围：公共头文件库存映射，不表示每个 BS20 / BS21E / BS22 构建目标均启用所有模块。
# 不扫描应用、驱动实现、HAL、内核实现、第三方库、工具链及生成目录。
# 当前源码不存在 Wi-Fi 和 SLE CHBA 公共目录，因此不保留 WS63 中的对应映射。
#
# 匹配规则：最长路径前缀优先；子模块完整名为 {父模块名}.{子模块名}。
# keep 让共享类型/接口留在父模块；未细分的新头文件会归入自动生成的 others。
# exclude 在 AST 解析前过滤；各项均为实际存在的文件或目录，不使用 glob。
# 清理规则：移除当前仓库中没有源码、可链接库或 ROM 导出证据的接口。
# 保留已确认的源码实现、闭源库实现，以及片内 NFC T2T Tag 底层支持。

modules:
  # ============================================
  # 公共定义 (Common)
  # ============================================
  common:
    path: include
    submodules:
      version:
        path:
          - include/cfbb_version.h
          - include/middleware/utils/sdk_version.h
      errcode:
        path: include/errcode.h
      common_def:
        path: include/common_def.h

  # ============================================
  # Driver 层
  # ============================================
  driver:
    path: include/driver
    # driver_backup 为备份目录，延续参考配置的排除边界。
    exclude:
      # 当前仓库只有声明和配置入口，没有驱动源码、可链接库或 ROM UAPI。
      - include/driver/driver_backup
      - include/driver/can.h
      - include/driver/sdio
      - include/driver/calendar.h
      - include/driver/edge.h
      - include/driver/mem_monitor.h
      - include/driver/pcm.h
      - include/driver/tsensor.h
      # 上游仍保留的已清理头文件，避免自动归入 others。
      - include/driver/eflash.h
      - include/driver/nandflash.h
      - include/driver/ssi.h
    submodules:
      security:
        path: include/driver/security_unified
        exclude:
          # 无有效实现链，剩余密钥管理类型未发现仓库内业务引用。
          - include/driver/security_unified/km.h
          # 无有效实现链；本地已删除，上游仍保留。
          - include/driver/security_unified/cipher_aead.h
          - include/driver/security_unified/cipher_mac.h
          - include/driver/security_unified/security_init.h
          - include/driver/security_unified/security_sha256.h
        # cipher/PKE 类型仍被升级校验条件分支引用；保留不等于全量 API 可用。
        submodules:
          pke:
            path: include/driver/security_unified/unified_cipher_pke.h
          trng:
            path: include/driver/security_unified/trng.h
          # 保留适配入口；对应功能是否可用仍需按目标宏和实现链确认。
          hw_security_init:
            path: include/driver/security_unified/mbedtls_harden_adapt.h
          cipher:
            path: include/driver/security_unified/cipher.h
      gpio:
        path: include/driver/gpio.h
      uart:
        path: include/driver/uart.h
      spi:
        path: include/driver/spi.h
      i2c:
        path: include/driver/i2c.h
      pwm:
        path: include/driver/pwm.h
      adc:
        path: include/driver/adc.h
      timer:
        path: include/driver/timer.h
      watchdog:
        path: include/driver/watchdog.h
      dma:
        path: include/driver/dma.h
      i2s:
        path: include/driver/i2s.h
      rtc:
        path: include/driver/rtc.h
      pinctrl:
        path: include/driver/pinctrl.h
      sfc:
        path:
          - include/driver/sfc.h
          - include/driver/sfc
        keep:
          - include/driver/sfc.h
        submodules:
          config:
            path: include/driver/sfc/sfc_config_info.h
      systick:
        path: include/driver/systick.h
      tcxo:
        path: include/driver/tcxo.h
      pm_clock:
        path: include/driver/pm_clock.h
      pm_pmu:
        path: include/driver/pm_pmu.h
      efuse:
        submodules:
          core:
            path: include/driver/efuse.h
          user:
            path: include/driver/efuse_user.h
      pmp:
        path: include/driver/drv_pmp.h
      keyscan:
        path: include/driver/keyscan.h
      pdm:
        path: include/driver/pdm.h
      qdec:
        path: include/driver/qdec.h
      # 本仓库将 flash 目录声明为 PUBLIC_HEADER，保留其 API 与配置类型。
      flash:
        path: include/driver/flash
        submodules:
          core:
            path: include/driver/flash/flash.h
          config:
            path:
              - include/driver/flash/flash_common_config.h
              - include/driver/flash/flash_config_info.h
              - include/driver/flash/flash_dosilicon_config.h
              - include/driver/flash/flash_gigadevice_config.h
              - include/driver/flash/flash_mxic_config.h
              - include/driver/flash/flash_others_config.h
              - include/driver/flash/flash_winbond_config.h
      ir:
        path: include/driver/ir
        submodules:
          study:
            path: include/driver/ir/ir_study.h
          tx:
            path: include/driver/ir/ir_tx.h
      usb:
        path: include/driver/usb
        exclude:
          # 仅剩已清理函数的空壳，不作为公开模块扫描。
          - include/driver/usb/host/usb_host.h
        submodules:
          common:
            path: include/driver/usb/implementation/_types_ref.h
          # USB Sample 直接引用 implementation/usb_init.h，故保留此公开入口。
          init:
            path: include/driver/usb/implementation/usb_init.h
          uvc:
            path: include/driver/usb/uvc
            exclude:
              # 仅剩协议结构/宏；未发现仓库内消费者，同名宏的独立定义不算依赖。
              - include/driver/usb/uvc/usb_v4l2.h

  # ============================================
  # OSAL 层
  # ============================================
  osal:
    path: kernel/osal/include
    submodules:
      common:
        path:
          - kernel/osal/include/osal_def.h
          - kernel/osal/include/osal_errno.h
          - kernel/osal/include/osal_ioctl.h
          - kernel/osal/include/osal_list.h
          - kernel/osal/include/soc_osal.h
      atomic:
        path: kernel/osal/include/atomic
      debug:
        path: kernel/osal/include/debug
      device:
        path: kernel/osal/include/device
      drvbox:
        path: kernel/osal/include/drvbox
      event:
        path: kernel/osal/include/event
      fileops:
        path: kernel/osal/include/fileops
      interrupt:
        path: kernel/osal/include/interrupt
      lock:
        path: kernel/osal/include/lock
        submodules:
          mutex:
            path: kernel/osal/include/lock/osal_mutex.h
          rwlock:
            path: kernel/osal/include/lock/osal_rwlock.h
          spinlock:
            path: kernel/osal/include/lock/osal_spinlock.h
      math:
        path: kernel/osal/include/math
        submodules:
          bitmap:
            path: kernel/osal/include/math/osal_bitmap.h
          arithmetic:
            path: kernel/osal/include/math/osal_math.h
      memory:
        path: kernel/osal/include/memory
        submodules:
          address:
            path: kernel/osal/include/memory/osal_addr.h
          barrier:
            path: kernel/osal/include/memory/osal_barrier.h
          cache:
            path: kernel/osal/include/memory/osal_cache.h
      msgqueue:
        path: kernel/osal/include/msgqueue
      proc:
        path: kernel/osal/include/proc
      schedule:
        path: kernel/osal/include/schedule
        submodules:
          completion:
            path: kernel/osal/include/schedule/osal_completion.h
          delaywork:
            path: kernel/osal/include/schedule/osal_delaywork.h
          task:
            path: kernel/osal/include/schedule/osal_task.h
          wait:
            path: kernel/osal/include/schedule/osal_wait.h
          workqueue:
            path: kernel/osal/include/schedule/osal_workqueue.h
      semaphore:
        path: kernel/osal/include/semaphore
      string:
        path: kernel/osal/include/string
      time:
        path: kernel/osal/include/time

  # ============================================
  # Middleware 层
  # ============================================
  middleware:
    path: include/middleware
    submodules:
      radar:
        path: include/middleware/services/radar
        exclude:
          # sub-6G 专用 API 与现有 SLP Radar 库的同名符号归属不明。
          - include/middleware/services/radar/radar_service_sub_6g.h
        submodules:
          service:
            path:
              - include/middleware/services/radar/radar_service.h
              - include/middleware/services/radar/radar_errcode.h
          slp:
            path: include/middleware/services/radar/radar_service_slp.h
      slp:
        path: include/middleware/services/slp
      utils:
        path: include/middleware/utils
        submodules:
          dfx:
            path:
              - include/middleware/utils/diag.h
              - include/middleware/utils/diag_log.h
          at:
            path: include/middleware/utils/at.h
          nv:
            path: include/middleware/utils/nv.h
          partition:
            path: include/middleware/utils/partition.h
          crc:
            path: include/middleware/utils/uapi_crc.h
          upgrade:
            path: include/middleware/utils/upg.h
          usb_class:
            path: include/middleware/utils/usb_class
            # 以下 8 个头文件在 Description 中明确标注为 Private。
            exclude:
              - include/middleware/utils/usb_class/gadget/camera_control_pri.h
              - include/middleware/utils/usb_class/gadget/composite_pri.h
              - include/middleware/utils/usb_class/gadget/f_dfu_pri.h
              - include/middleware/utils/usb_class/gadget/f_hid_pri.h
              - include/middleware/utils/usb_class/gadget/f_uac_pri.h
              - include/middleware/utils/usb_class/gadget/f_uvc_pri.h
              - include/middleware/utils/usb_class/gadget/usbd_audio_pri.h
              - include/middleware/utils/usb_class/gadget/usbd_video_ioctl_pri.h
            submodules:
              composite:
                path:
                  - include/middleware/utils/usb_class/gadget/composite_adapter.h
                  - include/middleware/utils/usb_class/gadget/composite_gadget.h
              hid:
                path:
                  - include/middleware/utils/usb_class/gadget/f_hid.h
                  - include/middleware/utils/usb_class/gadget/usbd_hid.h
              cdc:
                path:
                  - include/middleware/utils/usb_class/gadget/f_acm.h
                  - include/middleware/utils/usb_class/gadget/usbd_acm.h
                  - include/middleware/utils/usb_class/gadget/usbd_cdc.h
              dfu:
                path: include/middleware/utils/usb_class/gadget/f_dfu.h
              # RNDIS 兼容头仍包含 f_ether.h，暂保留其数据定义。
              ethernet:
                path: include/middleware/utils/usb_class/gadget/f_ether.h
              mass_storage:
                path:
                  - include/middleware/utils/usb_class/gadget/f_mass_storage.h
                  - include/middleware/utils/usb_class/gadget/f_mass_storage_ram.h
              audio:
                path:
                  - include/middleware/utils/usb_class/gadget/f_uac.h
                  - include/middleware/utils/usb_class/gadget/usbd_audio.h
              video:
                # camera_control.h / hicamera_control.h 仅转发包含 UVC 头文件。
                path:
                  - include/middleware/utils/usb_class/gadget/f_uvc.h
                  - include/middleware/utils/usb_class/gadget/usbd_video.h
                  - include/middleware/utils/usb_class/gadget/usbd_video_ioctl.h
                  - include/middleware/utils/usb_class/gadget/camera_control.h
                  - include/middleware/utils/usb_class/gadget/hicamera_control.h
      bts:
        path: include/middleware/services/bts
        exclude:
          # BR/经典蓝牙控制器链未在当前 SDK 中交付。
          - include/middleware/services/bts/br
        submodules:
          common:
            path: include/middleware/services/bts/common
          ble:
            path: include/middleware/services/bts/ble
            submodules:
              gap:
                path: include/middleware/services/bts/ble/bts_le_gap.h
              gatt:
                path: include/middleware/services/bts/ble/bts_gatt_stru.h
                submodules:
                  client:
                    path: include/middleware/services/bts/ble/bts_gatt_client.h
                  server:
                    path: include/middleware/services/bts/ble/bts_gatt_server.h
                keep:
                  - include/middleware/services/bts/ble/bts_gatt_stru.h
              factory:
                path: include/middleware/services/bts/ble/bts_factory.h
              low_latency:
                path: include/middleware/services/bts/ble/bts_low_latency.h
      sle:
        path: include/middleware/services/bts/sle
        submodules:
          common:
            path:
              - include/middleware/services/bts/sle/sle_common.h
              - include/middleware/services/bts/sle/sle_errcode.h
          connection:
            path:
              - include/middleware/services/bts/sle/sle_connection_manager.h
              - include/middleware/services/bts/sle/sle_device_discovery.h
              - include/middleware/services/bts/sle/sle_transmition_manager.h
              - include/middleware/services/bts/sle/sle_device_manager.h
          ssap:
            path:
              - include/middleware/services/bts/sle/sle_ssap_client.h
              - include/middleware/services/bts/sle/sle_ssap_server.h
              - include/middleware/services/bts/sle/sle_ssap_stru.h
            submodules:
              client:
                path: include/middleware/services/bts/sle/sle_ssap_client.h
              server:
                path: include/middleware/services/bts/sle/sle_ssap_server.h
            keep:
              - include/middleware/services/bts/sle/sle_ssap_stru.h
          service:
            submodules:
              factory:
                path: include/middleware/services/bts/sle/sle_factory_manager.h
              glp:
                path: include/middleware/services/bts/sle/sle_glp_manager.h
              hadm:
                path: include/middleware/services/bts/sle/sle_hadm_manager.h
              low_latency:
                path: include/middleware/services/bts/sle/sle_low_latency.h
              # SDK 1.0.20 已移除 sle_ota.h；OTA 实现转到应用样例，不纳入公共头文件映射。
          # SLEM 测距/定位算法按语义归入 SLE，路径仍位于 bts/slem。
          slem:
            path: include/middleware/services/bts/slem
            exclude:
              # appalg 定位/钥匙 API 未找到对应库符号。
              - include/middleware/services/bts/slem/slem_appalg
            submodules:
              posalg:
                path: include/middleware/services/bts/slem/slem_posalg
      nfc:
        path: include/middleware/services/nfc
        exclude:
          # 公共 NFC_HAL/NCI/Poller 接口没有匹配实现；T2T Tag 保留在 nfc/tag。
          - include/middleware/services/nfc/controller
        submodules:
          tag:
            path: include/middleware/services/nfc/tag
